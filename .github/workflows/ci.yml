name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # Each check below runs regardless of whether an earlier check in this
      # group failed (so one failure doesn't hide the others), but still
      # requires Set up Go to have actually succeeded — steps.setup-go.outcome
      # != 'failure' short-circuits all four if Go itself failed to install,
      # instead of masking that failure behind four unrelated "command not
      # found" errors.
      - name: go vet
        if: steps.setup-go.outcome != 'failure' && !cancelled()
        run: go vet ./...

      - name: gofmt
        if: steps.setup-go.outcome != 'failure' && !cancelled()
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go build
        if: steps.setup-go.outcome != 'failure' && !cancelled()
        run: go build ./...

      - name: go test
        if: steps.setup-go.outcome != 'failure' && !cancelled()
        run: go test ./... -race

      - name: docker build
        if: ${{ !cancelled() }}
        run: docker build .
